name: Deploy Website

on:
  push:
    branches: [ main, staging ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Determine environment-specific values
      - name: Set environment variables
        id: env-vars
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "DEPLOY_PATH=scheduler" >> $GITHUB_OUTPUT
            echo "BASE_PATH=/scheduler/" >> $GITHUB_OUTPUT
            echo "APP_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/scheduler/" >> $GITHUB_OUTPUT
            echo "ENV_NAME=production" >> $GITHUB_OUTPUT
          else
            echo "DEPLOY_PATH=staging" >> $GITHUB_OUTPUT
            echo "BASE_PATH=/staging/" >> $GITHUB_OUTPUT
            echo "APP_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/staging/" >> $GITHUB_OUTPUT
            echo "ENV_NAME=staging" >> $GITHUB_OUTPUT
          fi
          echo "✅ Environment: ${{ github.ref_name }}"

      - name: Create environment variables
        run: |
          cat > .env << EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL=${{ steps.env-vars.outputs.APP_URL }}
          VITE_BASE_PATH=${{ steps.env-vars.outputs.BASE_PATH }}
          EOF
          echo "✅ Environment file created for ${{ steps.env-vars.outputs.ENV_NAME }}"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ steps.env-vars.outputs.APP_URL }}
          NODE_ENV: production

      - name: Verify build output
        run: |
          echo "📁 Dist structure:"
          ls -la dist/ | head -20
          echo ""
          echo "✅ Ready for deployment"

      # Deploy to a subdirectory WITHOUT force_orphan so it doesn't wipe the other env
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.env-vars.outputs.DEPLOY_PATH }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Post-Deployment Test
        run: |
          echo "🌐 Deployment completed for ${{ steps.env-vars.outputs.ENV_NAME }}!"
          echo ""
          echo "URL: ${{ steps.env-vars.outputs.APP_URL }}"