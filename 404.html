<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Port Arthur PD Scheduler - Redirecting...</title>
    <script type="text/javascript">
      // Redirect GitHub Pages 404s to the correct base path (staging or production)
      var pathname = window.location.pathname;
      var basePath = '/scheduler/';
      if (pathname.includes('/scheduler/staging')) {
        basePath = '/scheduler/staging/';
      }
      // If user hit /scheduler/staging without trailing slash, redirect to /scheduler/staging/
      if (pathname === '/scheduler/staging' || pathname === '/scheduler/staging/') {
        window.location.replace(basePath + window.location.hash);
      } else {
        // General SPA fallback for subroutes
        var subpath = pathname.replace(/^\/scheduler\/(staging\/)?/, '');
        window.location.replace(basePath + (subpath ? '#/' + subpath : '') + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <p>Redirecting to Port Arthur PD Scheduler...</p>
  </body>
</html>
